<div class="main-menu flex items-center w-full gap-2 p-1 pl-0">
  {{/* 左侧：图标 + 站点名，点击回到博客首页 blog.html */}}
  <a href="https://findtreasureisland.github.io/" class="flex items-center gap-2 shrink-0" aria-label="{{ .Site.Title }}">
    <img
      src="{{ "images/logoicon.png" | relURL }}"
      alt=""
      class="nozoom h-9 w-9 object-contain"
      width="36"
      height="36">
    <span class="text-base font-medium truncate min-w-0">{{ .Site.Title | markdownify }}</span>
  </a>

  {{/* 右侧：导航菜单 + 搜索 + 夜间模式 */}}
  <div class="flex items-center gap-3 ms-auto">
    <div class="hidden md:flex">
      {{ partial "header/components/desktop-menu.html" . }}
    </div>
    <div class="flex md:hidden">
      {{ partial "header/components/mobile-menu.html" . }}
    </div>
    <div class="hidden md:flex items-center">
      <button
        id="appearance-switcher"
        aria-label="{{ i18n "footer.dark_appearance" }}"
        type="button"
        class="text-sm bf-icon-color-hover"
        title="{{ i18n "footer.dark_appearance" }}">
        <div class="flex items-center justify-center dark:hidden">
          {{ partial "icon.html" "moon" }}
        </div>
        <div class="items-center justify-center hidden dark:flex">
          {{ partial "icon.html" "sun" }}
        </div>
      </button>
    </div>
  </div>
</div>
