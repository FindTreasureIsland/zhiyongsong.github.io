# -- 站点配置 --
baseURL = "http://findtreasureisland.github.io/"
theme = "blowfish"
defaultContentLanguage = "zh-cn"
defaultContentLanguageInSubdir = false

title = "Find TreasureIsland"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true
summaryLength = 70

buildDrafts = false
buildFuture = false

# 文章 URL 保持旧站形态（根路径 + 文件名），避免迁移后旧链接失效
[permalinks]
  posts = ":contentbasename"

[pagination]
  pagerSize = 20

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  codeFences = true
  guessSyntax = true
  lineNos = true
  lineNumbersInTable = false
  noClasses = false
